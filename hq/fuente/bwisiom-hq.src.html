<title>BWISIOM HQ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* BWISIOM HQ — app única para escritorio y celular sobre la misma base de datos.
   Celular: barra superior + navegación inferior (Comando al centro) + hojas que suben desde abajo.
   Escritorio (>=900px): barra lateral con todos los módulos. Tema oscuro fijo por marca: negro, morado, blanco (naranjo como acento heredado). */
:root{
  --bg:#08070C; --bg2:#0E0C15; --panel:#15121E; --panel2:#1E1A2B; --panel3:#272238; --line:rgba(155,77,255,.24); --line2:rgba(255,255,255,.08);
  --fg:#F6F4FC; --muted:#B9B5C9; --dim:#8A8599;
  --morado:#6A00FF; --morado-claro:#9B4DFF; --lila:#D3B8FF; --naranjo:#FF7A00;
  --ok:#2BD47D; --warn:#FFC23D; --crit:#FF4D5E; --info:#5AB8FF;
  --yt:#FF3D3D; --tt:#25F4EE; --tt2:#FE2C55; --ig:#E1306C; --x:#E7E7EA; --kick:#53FC18; --twitch:#9146FF;
  --display:"Anton",Impact,"Arial Narrow Bold",sans-serif; --body:"Barlow","Segoe UI",system-ui,Arial,sans-serif; --mono:"JetBrains Mono",Consolas,monospace;
  --top:56px; --nav:66px; --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;min-height:100vh;min-height:100dvh;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 70% 40% at 0% 0%,rgba(106,0,255,.28),transparent 70%),radial-gradient(ellipse 50% 35% at 100% 100%,rgba(155,77,255,.14),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lila);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Splash */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;transition:opacity .4s}
#splash.out{opacity:0;pointer-events:none}
#splash .in{display:grid;justify-items:center;gap:14px}
#splash img{width:96px;height:96px;border-radius:50%;box-shadow:0 0 0 3px var(--morado),0 0 40px rgba(106,0,255,.8)}
#splash .nm{font-family:var(--display);font-style:italic;letter-spacing:3px;font-size:26px}
#splash .nm b{color:var(--morado-claro);font-weight:400}
#splash .ld{width:140px;height:3px;border-radius:3px;background:var(--panel2);overflow:hidden}
#splash .ld i{display:block;width:40%;height:100%;background:linear-gradient(90deg,var(--morado),#fff);animation:ld 1.1s ease-in-out infinite}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}

/* Estructura */
.app{position:relative;z-index:1}
header.bar{position:sticky;top:0;z-index:30;height:calc(var(--top) + var(--sat));padding:var(--sat) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:10px;background:rgba(8,7,12,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;background:none;border:0;padding:0;text-align:left}
.brand img{width:34px;height:34px;border-radius:50%;box-shadow:0 0 0 2px var(--morado),0 0 16px rgba(106,0,255,.6);flex:none}
.brand .t{font-family:var(--display);font-style:italic;letter-spacing:1.5px;font-size:20px;line-height:1;white-space:nowrap}
.brand .t b{color:var(--morado-claro);font-weight:400}
.brand .mode{font:700 9.5px var(--body);letter-spacing:.16em;color:var(--lila);border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:3px;font-style:normal}
.bar .sp{flex:1}
.sync{display:flex;align-items:center;gap:6px;font:500 11px var(--mono);color:var(--dim);background:var(--panel);border:1px solid var(--line2);border-radius:999px;padding:5px 9px;white-space:nowrap}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.sync.live .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)} .sync.stale .dot{background:var(--warn)} .sync.err .dot{background:var(--crit)}
.ibtn{position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:var(--panel);border:1px solid var(--line2);flex:none}
.ibtn:hover{border-color:var(--morado-claro)}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--crit);color:#fff;font:700 11px/18px var(--body);text-align:center}
.badge[hidden]{display:none}
.layout{display:block}
aside.side{display:none}
main#view{padding:14px max(14px,env(safe-area-inset-left,0px)) calc(var(--nav) + var(--sab) + 28px) max(14px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto;min-width:0}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--nav) + var(--sab));padding-bottom:var(--sab);display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(14,12,21,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
nav.bottom button{background:none;border:0;display:grid;justify-items:center;align-content:center;gap:3px;color:var(--dim);font:600 11px var(--body);position:relative}
nav.bottom button[aria-current="page"]{color:var(--fg)}
nav.bottom button[aria-current="page"] svg{color:var(--morado-claro)}
nav.bottom button.cmd .ring{width:52px;height:52px;margin-top:-22px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,var(--morado),#3B0090);box-shadow:0 0 0 4px var(--bg),0 6px 24px rgba(106,0,255,.7);color:#fff}
nav.bottom button.cmd .ring svg{width:24px;height:24px}
nav.bottom .badge{top:4px;right:calc(50% - 22px)}
@media (min-width:900px){
  nav.bottom{display:none}
  .layout{display:grid;grid-template-columns:240px minmax(0,1fr)}
  aside.side{display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(var(--top) + var(--sat));height:calc(100vh - var(--top) - var(--sat));overflow-y:auto;padding:16px 12px;border-right:1px solid var(--line)}
  aside.side button{display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:10px;padding:10px 12px;color:var(--muted);font-weight:600;text-align:left;position:relative}
  aside.side button:hover{background:var(--panel)}
  aside.side button[aria-current="page"]{background:linear-gradient(90deg,rgba(106,0,255,.35),rgba(106,0,255,.08));color:var(--fg);box-shadow:inset 3px 0 0 var(--morado-claro)}
  aside.side .badge{position:static;margin-left:auto}
  aside.side .grp{font:700 10.5px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:14px 12px 4px}
  main#view{padding:22px 28px 60px}
}

/* Tipografía y piezas */
h1.vt{font-family:var(--display);font-weight:400;font-style:italic;letter-spacing:1.5px;font-size:clamp(26px,6vw,36px);line-height:1.05;margin:4px 0 2px}
.vs{color:var(--muted);font-size:13.5px;margin:0 0 14px}
h2{font-family:var(--display);font-weight:400;font-style:italic;letter-spacing:1px;font-size:21px;margin:22px 0 10px;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:8px;height:20px;background:var(--morado-claro);transform:skewX(-14deg);flex:none}
h2 .n{font:500 12px var(--mono);font-style:normal;color:var(--dim)}
h2 .act{margin-left:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:700px){.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g2w{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:699px){.g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0;text-align:left;display:block;width:100%}
button.kpi:hover{border-color:var(--morado-claro)}
.lab{font:700 10.5px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font-family:var(--display);font-size:30px;line-height:1.1;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .det{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.kpi.hot{border-color:var(--morado-claro);background:linear-gradient(135deg,rgba(106,0,255,.3),var(--panel) 65%)}
.kpi.warn .val{color:var(--warn)} .kpi.crit .val{color:var(--crit)} .kpi.okc .val{color:var(--ok)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-weight:600;min-height:40px;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--morado-claro)}
.btn.pri{background:var(--morado);border-color:var(--morado);color:#fff;box-shadow:0 4px 18px rgba(106,0,255,.45)}
.btn.pri:hover{background:#7A1AFF}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--crit);color:var(--crit);background:transparent}
.btn.danger.sure{background:var(--crit);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px;min-height:32px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.wide{width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:600 13px var(--body);color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 13px;white-space:nowrap}
.chip[aria-pressed="true"]{color:#fff;border-color:var(--morado-claro);background:rgba(106,0,255,.32)}
.seg{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1 0 auto;background:none;border:0;border-radius:9px;padding:8px 12px;font-weight:700;color:var(--muted);white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--morado);color:#fff}
.empty{font-size:13.5px;color:var(--dim);border:1px dashed var(--line);border-radius:12px;padding:16px;text-align:center}
.cfg{border:1px dashed var(--warn);background:rgba(255,194,61,.06);border-radius:14px;padding:14px;font-size:14px;color:var(--muted)}
.cfg b{color:var(--fg)} .cfg .h{display:flex;align-items:center;gap:8px;color:var(--warn);font-weight:700;margin-bottom:6px}
.cfg ol{margin:8px 0 0;padding-left:20px} .cfg li{margin:3px 0}
.code{font-family:var(--mono);font-size:11.5px;color:var(--dim);overflow-wrap:anywhere}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:13px}
.tag{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:rgba(155,77,255,.18);color:var(--lila);white-space:nowrap}
.pill{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap;border:1px solid currentColor;display:inline-flex;align-items:center;gap:5px}
.st-pendiente,.s-pendiente{color:var(--warn)} .st-ejecutando{color:var(--info)} .st-completado,.st-completada{color:var(--ok)} .st-fallido{color:var(--crit)} .st-esperando_pc,.st-enviado{color:var(--lila)} .st-pendiente_config{color:var(--naranjo)}
.st-ejecutando::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:pl 1s infinite}
@keyframes pl{50%{opacity:.25}}
.pr-alta{color:var(--crit)} .pr-media{color:var(--warn)} .pr-baja{color:var(--info)}
.list{display:grid;gap:8px}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:12px;min-width:0;width:100%;text-align:left;color:inherit}
button.item:hover,.item.tap:hover{border-color:var(--line)}
.item .b{flex:1;min-width:0}
.item .t{font-weight:700;overflow-wrap:anywhere}
.item .m{font-size:12.5px;color:var(--muted);display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;margin-top:3px}
.item.done .t{text-decoration:line-through;color:var(--dim)}
.item.over{border-color:rgba(255,77,94,.5)}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--morado-claro);background:transparent;flex:none;display:grid;place-items:center;margin-top:1px;padding:0}
.chk.on{background:var(--morado);border-color:var(--morado)}
.chk.on svg{color:#fff}
.chk svg{width:16px;height:16px;color:transparent}
.bar{height:7px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--morado),var(--lila))}
.search{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--nav) + var(--sab) + 16px);z-index:25;width:56px;height:56px;border-radius:18px;border:0;background:var(--morado);color:#fff;display:grid;place-items:center;box-shadow:0 8px 28px rgba(106,0,255,.6)}
.fab svg{width:26px;height:26px}
@media (min-width:900px){.fab{bottom:28px;right:28px}}
.fab[hidden]{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + var(--sab) + 18px);background:var(--fg);color:#120A20;font-weight:700;padding:11px 18px;border-radius:12px;z-index:90;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast.err{background:var(--crit);color:#fff}
@media (min-width:900px){.toast{bottom:24px}}
@media (prefers-reduced-motion:no-preference){
  main#view>section{animation:fin .22s ease-out}
  @keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .sheet{transition:transform .25s ease}
}

/* Hojas (editor) */
.drawer{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(4,3,8,.65)}
.drawer[hidden]{display:none!important}
.sheet{width:100%;max-height:92vh;max-height:92dvh;overflow-y:auto;background:var(--panel);border-top:3px solid var(--morado);border-radius:20px 20px 0 0;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(24px + var(--sab)) max(16px,env(safe-area-inset-left,0px))}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--panel3);margin:0 auto 12px}
@media (min-width:900px){.drawer{justify-content:flex-end;align-items:stretch}.sheet{width:min(560px,100%);max-height:none;height:100%;border-radius:0;border-top:0;border-left:3px solid var(--morado);padding:20px 22px 30px}.sheet .grab{display:none}}
.sheet h3{font-family:var(--display);font-style:italic;font-weight:400;font-size:25px;margin:0 0 14px;display:flex;align-items:center;gap:10px}
.sheet h3 .x{margin-left:auto}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.fgrid .full{grid-column:1/-1}
@media (max-width:560px){.fgrid{grid-template-columns:minmax(0,1fr)}}
label.f{display:grid;gap:4px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;min-width:0;font-weight:600}
label.f input,label.f select,label.f textarea,.inp{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;font-size:16px;text-transform:none;letter-spacing:0;color:var(--fg);width:100%;min-width:0;font-weight:400}
label.f textarea,textarea.inp{min-height:76px;resize:vertical}
fieldset.red{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:12px 0 0;min-width:0}
fieldset.red legend{padding:0 6px;font-weight:700}
.redes-check{display:flex;flex-wrap:wrap;gap:8px}
.redes-check label{display:flex;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
.sheet .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;align-items:center}
.sheet .msg{font-size:13px;color:var(--warn);width:100%}
.menu-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.menu-grid button{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:16px 8px;display:grid;justify-items:center;gap:8px;font-weight:600;font-size:13px;position:relative}
.menu-grid button svg{width:26px;height:26px;color:var(--morado-claro)}
.menu-grid .badge{top:6px;right:6px}

/* Contenido (heredado de HQ Control) */
.plat{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
.plat.youtube{background:var(--yt);color:#fff;border:0} .plat.tiktok{background:var(--tt);color:#000;border:0} .plat.instagram{background:var(--ig);color:#fff;border:0}
.plat.x{background:var(--x);color:#000;border:0} .plat.kick{background:var(--kick);color:#000;border:0} .plat.twitch{background:var(--twitch);color:#fff;border:0}
.edit{margin-left:auto;background:transparent;border:1px solid var(--line);border-radius:7px;color:var(--muted);font-size:12px;padding:3px 9px}
.edit:hover{color:var(--fg);border-color:var(--morado-claro)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(270px,85%);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;align-items:start}
.board>.col{scroll-snap-align:start}
@media (min-width:900px){.board{grid-auto-flow:row;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));overflow:visible}}
.col{background:rgba(21,18,30,.8);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.col h3{margin:0 0 4px;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;display:flex;justify-content:space-between}
.col h3 .c{font-family:var(--mono);color:var(--dim)}
.col .hint{font-size:12px;color:var(--dim);margin:0 0 10px}
.col[data-k="listo"]{border-color:rgba(155,77,255,.7)} .col[data-k="listo"] h3{color:var(--lila)}
.col[data-k="subido"] h3{color:var(--ok)} .col[data-k="programado"] h3{color:var(--warn)} .col[data-k="revision"] h3{color:var(--info)}
.cards{display:grid;gap:10px}
.vcard{background:var(--panel2);border-radius:10px;padding:11px;border-left:4px solid var(--morado-claro);min-width:0}
.vcard.p-youtube{border-left-color:var(--yt)} .vcard.p-tiktok{border-left-color:var(--tt)} .vcard.p-instagram{border-left-color:var(--ig)} .vcard.p-x{border-left-color:var(--x)}
.vcard .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:6px}
.vcard .t{font-weight:700;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.note{font-size:13px;color:var(--muted);margin-top:6px;overflow-wrap:anywhere}
.lnk{color:var(--lila);font-weight:600;font-size:13px;text-decoration:none;display:inline-block;margin-top:6px}
.lnk:hover{text-decoration:underline}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.yt-card{background:#0F0F0F;border-radius:12px;overflow:hidden;min-width:0}
.thumb{aspect-ratio:9/16;max-height:300px;width:100%;display:flex;align-items:flex-end;padding:14px;position:relative;overflow:hidden}
.thumb .big{font-family:var(--display);font-style:italic;font-size:25px;line-height:1.05;text-transform:uppercase;-webkit-text-stroke:1px #000;text-shadow:0 3px 10px rgba(0,0,0,.7);overflow-wrap:anywhere}
.thumb .bdg{position:absolute;top:10px;left:10px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:5px;background:rgba(0,0,0,.65)}
.thumb .bdg.ok{background:var(--ok);color:#000} .thumb .bdg.listo{background:var(--morado-claro);color:#fff} .thumb .bdg.programado{background:var(--warn);color:#000}
.yt .thumb{background:linear-gradient(160deg,#3a0000,#0F0F0F 60%)}
.yt-meta{padding:10px 12px 14px;display:flex;gap:10px}

async function put(col,id,data,accion,detalle){if(!guard())throw{code:"no-edit"};const b=clean(data);b.actualizado=nowISO();b.dispositivo=DEV();await S.db.collection(col).doc(id).set(b);if(accion)log(accion,detalle);return id}
async function patch(col,id,data,accion,detalle){if(!guard())throw{code:"no-edit"};await S.db.collection(col).doc(id).update({...data,actualizado:nowISO(),dispositivo:DEV()});if(accion)log(accion,detalle)}
async function del(col,id,accion,detalle){if(!guard())throw{code:"no-edit"};await S.db.collection(col).doc(id).delete();log(accion,detalle)}
const errTxt=e=>(e&&(e.code||e.message))||"error";
function confirmTap(btn,fn,label="Pulsa otra vez para confirmar"){btn.addEventListener("click",async ev=>{ev.stopPropagation();if(!btn.dataset.sure){btn.dataset.sure=1;btn.dataset.orig=btn.innerHTML;btn.classList.add("sure");btn.textContent=label;setTimeout(()=>{if(btn.isConnected&&btn.dataset.sure){delete btn.dataset.sure;btn.classList.remove("sure");btn.innerHTML=btn.dataset.orig}},4000);return}delete btn.dataset.sure;btn.disabled=true;try{await fn()}finally{btn.disabled=false}})}

function askConfirm(title,text,ok,fn){openSheet(title,`<p class="muted">${esc(text)}</p><div class="actions"><button class="btn pri" id="acOk" type="button">${esc(ok)}</button><button class="btn" type="button" data-close>Cancelar</button><div class="msg" id="edMsg"></div></div>`);$("#acOk").onclick=async()=>{$("#acOk").disabled=true;try{await fn();closeSheet()}catch(e){$("#edMsg").textContent=String(e?.message||e);$("#acOk").disabled=false}}}

function proximas(dias){const lim=Date.now()+dias*864e5,now=Date.now(),out=[];
  S.tareas.forEach(t=>{if(t.estado!=="completada"&&t.fecha_limite){const x=new Date(t.fecha_limite).getTime();if(x<=lim)out.push({k:"tarea",t:t.titulo,f:t.fecha_limite,s:(x<now?"Vencida · ":"")+(t.proyecto?proyNombre(t.proyecto):"Tarea"),go:()=>openTarea(t._id)})}});
  S.estudios.forEach(e=>{const x=new Date(e.cierre).getTime();if(["pendiente","listo","por_abrir"].includes(e.estado)&&x>=now&&x<=lim)out.push({k:"iacc",t:e.asignatura+" · "+e.titulo,f:e.cierre,s:"IACC · "+lab(EST_EV,e.estado),go:()=>go("calendario","estudios")})});
  S.eventos.forEach(e=>{const x=new Date(e.inicio).getTime();if(x>=now-36e5&&x<=lim)out.push({k:"evento",t:e.titulo,f:e.inicio,s:lab(TIPO_EV,e.tipo||"personal"),go:()=>openEvento(e._id)})});
  S.videos.forEach(v=>Object.entries(v.plataformas||{}).forEach(([p,i])=>{if(i.estado==="programado"&&i.fecha){const x=new Date(i.fecha).getTime();if(x>=now-36e5&&x<=lim)out.push({k:"pub",t:(i.titulo||v.titulo),f:i.fecha,s:"Publicación programada · "+nm(p),go:()=>go("contenido","videos")})}}));
  (S.gcal?.items||[]).forEach(e=>{const x=new Date(e.f).getTime();if(x>=now-36e5&&x<=lim)out.push({k:"gcal",t:e.t,f:e.f,s:"Google Calendar",go:null})});
  return out.sort((a,b)=>new Date(a.f)-new Date(b.f))}

function parseTask(txt){let s=" "+txt+" ",prioridad="media",proyecto=null,f=null,hh=null,mi=0;const N=norm(s);
  const rm=re=>{s=s.replace(re," ")};

  else if(/\b(baja prioridad|prioridad baja|sin apuro)\b/i.test(N)){prioridad="baja";rm(/\b(baja prioridad|prioridad baja|sin apuro)\b/gi)}
  rm(/\bprioridad media\b/gi);
  const pm=s.match(/#([\wáéíóúñü\-]+)/i)||s.match(/\bproyecto\s+([\wáéíóúñü\-]+)/i);if(pm){const k=norm(pm[1]);proyecto=S.proyectos.find(p=>norm(p.nombre).includes(k))||null;s=s.replace(pm[0]," ")}
  const base=new Date(dayKey(Date.now())+"T12:00:00");
  const tm=s.match(/\ba las (\d{1,2})(?::(\d{2}))?\s*(am|pm|hrs?|h)?\b/i)||s.match(/\b(\d{1,2}):(\d{2})\s*(am|pm|hrs?|h)?\b/i)||s.match(/\b(\d{1,2})\s*(am|pm)\b/i);
  if(tm){hh=+tm[1];mi=+(tm[2]&&/^\d+$/.test(tm[2])?tm[2]:0);const ap=(tm[3]||(tm[2]&&!/^\d+$/.test(tm[2])?tm[2]:"")||"").toLowerCase();if(ap==="pm"&&hh<12)hh+=12;if(ap==="am"&&hh===12)hh=0;if(hh>23)hh=null;else s=s.replace(tm[0]," ")}

  if(/\bpasado mañana\b/i.test(s)){f=new Date(base.getTime()+2*864e5);rm(/\b(para )?pasado mañana\b/gi)}
  else if(/\bmañana\b/i.test(s)){f=new Date(base.getTime()+864e5);rm(/\b(para )?mañana\b/gi)}
  else if(/\bhoy\b/i.test(s)){f=new Date(base);rm(/\b(para )?hoy\b/gi)}
  else if(m=s.match(/\ben (\d{1,2}) d[ií]as\b/i)){f=new Date(base.getTime()+(+m[1])*864e5);s=s.replace(m[0]," ")}
  else if(m=s.match(/\b(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?\b/)){let y=m[3]?+m[3]:base.getFullYear();if(y<100)y+=2000;const d=new Date(y,+m[2]-1,+m[1],12);if(!m[3]&&d<base)d.setFullYear(y+1);if(!isNaN(d)){f=d;s=s.replace(m[0]," ")}}
  else{const dn=DIAS.findIndex(d=>new RegExp("\\b(el |este |para el )?"+d+"\\b").test(Ns()));if(dn>=0){let add=(dn-base.getDay()+7)%7;f=new Date(base.getTime()+add*864e5);s=s.replace(new RegExp("\\b(el |este |para el )?"+["domingo","lunes","martes","mi[eé]rcoles","jueves","viernes","s[aá]bado"][dn]+"\\b","i")," ")}}
  if(!f&&hh!=null)f=new Date(base);
  let iso;if(f)iso=zonedISO(f.getFullYear(),f.getMonth()+1,f.getDate(),hh!=null?hh:23,hh!=null?mi:59);
  const titulo=s.replace(/\s+(para|el|a las|con)\s*$/i,"").replace(/^\s*(recordar|recuérdame|tengo que|debo)\s+/i,"").replace(/\s{2,}/g," ").trim().replace(/^./,c=>c.toUpperCase());
  return{titulo,prioridad,proyecto,fecha_limite:iso}}

  const i=$("#tIn");if(!i)return;const pv=()=>{const r=parseTask(i.value);$("#tPrev").textContent=i.value.trim()?[r.fecha_limite?"📅 "+fmtF(r.fecha_limite):"",r.prioridad!=="media"?"Prioridad "+r.prioridad:"",r.proyecto?"Proyecto: "+r.proyecto.nombre:""].filter(Boolean).join(" · "):""};

function openTarea(id,draft){const t=id?S.tareas.find(x=>x._id===id):null;const o=t||draft||{};if(id&&!t)return;

  if(id){$("#tTog").onclick=async()=>{await toggleTarea(id);closeSheet()};confirmTap($("#tDel"),async()=>{try{await del("tareas",id,"Tarea eliminada",o.titulo);closeSheet();toast("Eliminada")}catch(e){$("#edMsg").textContent="No se pudo eliminar ("+errTxt(e)+")."}},"Pulsa otra vez para eliminar");
    const ca=async()=>{const v=$("#cIn").value.trim();if(!v)return;try{await patch("tareas",id,{comentarios:[...(t.comentarios||[]),{t:v.slice(0,2000),fecha:nowISO(),dispositivo:DEV()}]},"Comentario en tarea",t.titulo);setTimeout(()=>openTarea(id),250)}catch(e){toast("No se pudo guardar ("+errTxt(e)+")",true)}};

const stripMeta=o=>{const b={...o};delete b._id;delete b.actualizado;delete b.dispositivo;return b};

/* ---------- PROYECTOS ---------- */
const hist=(p,cambio)=>[...(p.historial||[]),{fecha:nowISO(),cambio,dispositivo:DEV()}].slice(-60);
function progProy(p){const ts=S.tareas.filter(t=>t.proyecto===p._id);if(ts.length)return Math.round(ts.filter(t=>t.estado==="completada").length/ts.length*100);return Number(p.progreso)||0}
function sysProjects(){const e=entradas(),vids=S.videos.length,pub=S.videos.filter(v=>Object.values(v.plataformas||{}).some(i=>i.estado==="subido")).length;
  const ev=S.estudios.length,ok=S.estudios.filter(x=>["entregado","calificado"].includes(x.estado)).length;
  return[{nombre:"Content Factory",desc:`${vids} videos en cola · ${e.filter(x=>x.col==="listo").length} listos para subir · ${S.clips.length} clips`,pr:vids?Math.round(pub/vids*100):0,prt:`${pub} de ${vids} videos publicados en al menos una red`,go:"contenido"},
    {nombre:"IACC — Estudios",desc:[...new Set(S.estudios.map(x=>x.asignatura))].join(" · ")||"Sin evaluaciones",pr:ev?Math.round(ok/ev*100):0,prt:`${ok} de ${ev} evaluaciones entregadas`,go:"calendario",sub:"estudios"}]}
VIEWS.proyectos=()=>{const nd=needData();const ps=S.proyectos.filter(match).sort((a,b)=>["activo","pausado","completado"].indexOf(a.estado||"activo")-["activo","pausado","completado"].indexOf(b.estado||"activo")||String(b.actualizado).localeCompare(String(a.actualizado)));
  return `<h1 class="vt">BWISIOM Projects</h1><p class="vs">Tus proyectos con tareas, notas, archivos e historial. Los módulos del sistema se calculan con los datos reales de HQ.</p>${nd}
  <h2>Módulos del sistema</h2><div class="grid g2w">${sysProjects().map(p=>`<button class="item" data-go="${p.go}" ${p.sub?`data-sub="${p.sub}"`:""} style="display:block"><div class="row" style="justify-content:space-between"><div class="t">${esc(p.nombre)}</div><span class="tag">Sistema</span></div><div class="small muted" style="margin-top:4px">${esc(p.desc)}</div><div class="bar"><i style="width:${p.pr}%"></i></div><div class="small dim">${esc(p.prt)}</div></button>`).join("")}</div>
  <h2>Mis proyectos <span class="n">${S.proyectos.length}</span>${S.canEdit?`<button class="btn sm act" id="pNew">${ic("plus")} Nuevo</button>`:""}</h2>
  ${ps.length?`<div class="grid g2w">${ps.map(p=>{const ts=S.tareas.filter(t=>t.proyecto===p._id),pend=ts.filter(t=>t.estado!=="completada").length,pr=progProy(p);
    return `<button class="item" data-popen="${esc(p._id)}" style="display:block"><div class="row" style="justify-content:space-between"><div class="t">${esc(p.nombre)}</div><span class="pill ${p.estado==="completado"?"st-completado":p.estado==="pausado"?"s-por_abrir":"st-ejecutando"}" style="${p.estado==="activo"||!p.estado?"":""}">${esc(lab(EST_PROY,p.estado||"activo"))}</span></div>
    ${p.descripcion?`<div class="small muted" style="margin-top:4px;overflow-wrap:anywhere">${esc(p.descripcion.slice(0,140))}</div>`:""}<div class="bar"><i style="width:${pr}%"></i></div>
    <div class="m small muted" style="display:flex;gap:10px;flex-wrap:wrap"><span>${pr}%</span><span>${pend} tareas pendientes de ${ts.length}</span><span>${(p.notas||[]).length} notas</span><span>${(p.archivos||[]).length} archivos</span>${p.fecha_objetivo?`<span>Meta: ${esc(fmtD(p.fecha_objetivo))}</span>`:""}</div></button>`}).join("")}</div>`:`<div class="empty">Aún no tienes proyectos propios.${S.canEdit?" Crea el primero con «Nuevo».":""}</div>`}`};
after.proyectos=()=>{$("#pNew")&&($("#pNew").onclick=()=>openProyecto());$$("[data-popen]").forEach(b=>b.onclick=()=>openProyecto(b.dataset.popen))};
function openProyecto(id){const p=id?S.proyectos.find(x=>x._id===id):null;if(id&&!p)return;const o=p||{};const ro=!S.canEdit;
  const ts=id?S.tareas.filter(t=>t.proyecto===id).sort((a,b)=>(a.estado==="completada")-(b.estado==="completada")):[];
  openSheet(id?o.nombre:"Nuevo proyecto",`<div class="fgrid">${inp("nombre","Nombre",o.nombre,"text",true)}${sel("estado","Estado",EST_PROY,o.estado||"activo")}${inp("fecha_objetivo","Fecha objetivo",o.fecha_objetivo?String(o.fecha_objetivo).slice(0,10):"","date")}
    ${inp("progreso","Progreso manual % (si no tiene tareas)",o.progreso??"","number",false,'min="0" max="100"')}${ta("descripcion","Descripción",o.descripcion)}</div>
    ${id?`<h2 style="font-size:18px">Tareas <span class="n">${ts.length} · ${progProy(o)}%</span></h2><div class="list">${ts.map(tareaItem).join("")||`<div class="empty">Sin tareas asociadas.</div>`}</div>
    ${ro?"":`<div class="row" style="margin-top:8px"><input class="inp" id="ptIn" placeholder="Nueva tarea para este proyecto…" style="flex:1"><button class="btn sm" id="ptAdd" type="button">Agregar</button></div>`}
    <h2 style="font-size:18px">Notas <span class="n">${(o.notas||[]).length}</span></h2><div class="list">${[...(o.notas||[])].reverse().map(n=>`<div class="item"><div class="b"><div style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(n.t)}</div><div class="m">${esc(fmtF(n.fecha))}</div></div></div>`).join("")||`<div class="empty">Sin notas.</div>`}</div>
    ${ro?"":`<div class="row" style="margin-top:8px"><textarea class="inp" id="pnIn" rows="2" placeholder="Agregar nota…" style="flex:1;min-height:44px"></textarea><button class="btn sm" id="pnAdd" type="button">Agregar</button></div>`}
    <h2 style="font-size:18px">Archivos relacionados <span class="n">${(o.archivos||[]).length}</span></h2><div class="list">${(o.archivos||[]).map((a,i)=>`<div class="item"><div class="b"><div class="code" style="color:var(--fg)">${/^https?:\/\//.test(a.ruta)?`<a class="lnk" style="margin:0" href="${esc(a.ruta)}" target="_blank" rel="noopener">${esc(a.nombre||a.ruta)} ↗</a>`:esc(a.nombre?a.nombre+" — "+a.ruta:a.ruta)}</div><div class="m">${esc(fmtF(a.fecha))}</div></div>${ro?"":`<button class="btn sm ghost" data-arm="${i}" type="button">Quitar</button>`}</div>`).join("")||`<div class="empty">Sin archivos. Agrega rutas del PC (ej. 01_STUDIO/…) o enlaces.</div>`}</div>
    ${ro?"":`<div class="row" style="margin-top:8px"><input class="inp" id="paIn" placeholder="Ruta en el PC o enlace…" style="flex:1"><button class="btn sm" id="paAdd" type="button">Agregar</button></div>`}
    <h2 style="font-size:18px">Historial de cambios</h2><div class="list">${[...(o.historial||[])].reverse().slice(0,30).map(h=>`<div class="item"><div class="b"><div style="font-weight:600">${esc(h.cambio)}</div><div class="m">${esc(fmtF(h.fecha))}${h.dispositivo?" · "+esc(h.dispositivo):""}</div></div></div>`).join("")||`<div class="empty">Sin historial.</div>`}</div>`:""}
    ${ro?"":`<div class="actions"><button class="btn pri" id="pSave" type="button">Guardar</button>${id?`<button class="btn danger" id="pDel" type="button" style="margin-left:auto">Eliminar proyecto</button>`:""}<div class="msg" id="edMsg"></div></div>`}`);
  if(ro){$$("#edBody input,#edBody select,#edBody textarea").forEach(e=>e.disabled=true);return}
  const reopen=()=>setTimeout(()=>openProyecto(id),250);
  $("#pSave").onclick=async()=>{const nombre=val("nombre");if(!nombre){$("#edMsg").textContent="Ponle un nombre.";return}const pr=val("progreso");
    const d={nombre,estado:val("estado"),fecha_objetivo:val("fecha_objetivo")||undefined,progreso:pr===""?undefined:Math.max(0,Math.min(100,Number(pr))),descripcion:val("descripcion")||undefined};
    try{if(id){const ch=Object.keys(d).filter(k=>String(d[k]??"")!==String(o[k]??""));const full={...stripMeta(o),...d};["fecha_objetivo","progreso","descripcion"].forEach(k=>{if(d[k]===undefined)delete full[k]});full.historial=hist(o,ch.length?"Editado: "+ch.join(", "):"Guardado sin cambios");await put("proyectos",id,full,"Proyecto editado",nombre)}
      else await put("proyectos",uid("p"),{...d,creado:nowISO(),historial:[{fecha:nowISO(),cambio:"Proyecto creado",dispositivo:DEV()}]},"Proyecto creado",nombre);closeSheet();toast("Guardado")}catch(e){$("#edMsg").textContent="No se pudo guardar ("+errTxt(e)+")."}};
  if(!id)return;
  confirmTap($("#pDel"),async()=>{try{for(const t of ts)await put("tareas",t._id,{...stripMeta(t),proyecto:undefined})}catch(e){}
    try{await del("proyectos",id,"Proyecto eliminado",o.nombre+(ts.length?` (${ts.length} tareas quedan sin proyecto)`:""));closeSheet();toast("Proyecto eliminado")}catch(e){$("#edMsg").textContent="No se pudo eliminar ("+errTxt(e)+")."}},ts.length?`Eliminar (sus ${ts.length} tareas se conservan)`:"Pulsa otra vez para eliminar");
  const addT=async()=>{const v=$("#ptIn").value.trim();if(!v)return;const r=parseTask(v);try{await put("tareas",uid("t"),{titulo:r.titulo,prioridad:r.prioridad,fecha_limite:r.fecha_limite,proyecto:id,estado:"pendiente",creado:nowISO(),origen:DEV()},"Tarea creada",r.titulo);await patch("proyectos",id,{historial:hist(o,"Tarea agregada: "+r.titulo)});reopen()}catch(e){toast("No se pudo guardar ("+errTxt(e)+")",true)}};
  $("#ptAdd").onclick=addT;$("#ptIn").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addT()}});
  $("#pnAdd").onclick=async()=>{const v=$("#pnIn").value.trim();if(!v)return;try{await patch("proyectos",id,{notas:[...(o.notas||[]),{t:v.slice(0,4000),fecha:nowISO()}],historial:hist(o,"Nota agregada")},"Nota en proyecto",o.nombre);reopen()}catch(e){toast("No se pudo guardar ("+errTxt(e)+")",true)}};
  $("#paAdd").onclick=async()=>{const v=$("#paIn").value.trim();if(!v)return;try{await patch("proyectos",id,{archivos:[...(o.archivos||[]),{ruta:v.slice(0,500),fecha:nowISO()}],historial:hist(o,"Archivo agregado: "+v.slice(0,80))},"Archivo en proyecto",o.nombre);reopen()}catch(e){toast("No se pudo guardar ("+errTxt(e)+")",true)}};
  $$("[data-arm]").forEach(b=>confirmTap(b,async()=>{const a=[...(o.archivos||[])];const[x]=a.splice(+b.dataset.arm,1);try{await patch("proyectos",id,{archivos:a,historial:hist(o,"Archivo quitado: "+(x?.ruta||"").slice(0,80))},"Archivo quitado",o.nombre);reopen()}catch(e){toast("No se pudo guardar",true)}},"¿Quitar?"))}

/* ---------- CONTENT FACTORY (Videos / Redes / Clips heredados) ---------- */
const COLS=[{k:"idea",t:"Ideas y producción",h:"En cola o renderizándose"},{k:"revision",t:"En revisión",h:"Hechos: falta tu visto bueno"},{k:"listo",t:"Listos para subir",h:"Aprobados: los subes tú"},{k:"programado",t:"Programados",h:"Agendados; confirma que salieron"},{k:"subido",t:"Subidos",h:"Publicados y comprobados"}];
function entradas(){const out=[];for(const v of S.videos){if(!match(v))continue;const pls=v.plataformas||{},ks=Object.keys(pls);
  if(!ks.length||v.etapa==="idea"||v.etapa==="produccion"){out.push({col:"idea",v,redes:v.redes||[]});continue}
  for(const p of ks){const st=pls[p].estado;out.push({col:st==="subido"?"subido":st==="programado"?"programado":st==="listo"?"listo":st==="revision"?"revision":"idea",v,p,i:pls[p]})}}return out}
const editBtn=(col,id)=>S.canEdit?`<button class="edit" data-ed="${col}" data-id="${esc(id)}">Editar</button>`:"";
function chipsH(key,opts,label){return `<div class="chips">${opts.map(([v,t])=>`<button class="chip" data-ck="${key}" data-v="${esc(v)}" aria-pressed="${S[key]===v}">${esc(t)}</button>`).join("")}</div>`}
document.addEventListener("click",e=>{const b=e.target.closest("[data-ck]");if(!b)return;S[b.dataset.ck]=b.dataset.v;render()});
VIEWS.contenido=()=>{const nd=needData();const s=S.sub.contenido||"videos";
  return `<h1 class="vt">BWISIOM Content Factory</h1><p class="vs">${esc(S.meta?.nota_videos||"Videos, Shorts, redes y clips del PC.")}</p>${nd}
  ${subnav("contenido",[["videos","Producción"],["redes","Redes"],["clips","Clips"],["ideas","Ideas"],["stats","Estadísticas"]])}
  <input class="search" id="cq" type="search" placeholder="Buscar en contenido…" value="${esc(S.q)}" style="margin-bottom:12px;${s==="stats"?"display:none":""}">
  ${({videos:vVideos,redes:vRedes,clips:vClips,ideas:vIdeas,stats:vStats}[s]||vVideos)()}`};
after.contenido=()=>{const q=$("#cq");if(q)q.oninput=()=>{S.q=q.value;const p=q.selectionStart;render();const n=$("#cq");n.focus();n.setSelectionRange(p,p)};$("#ytRef")&&($("#ytRef").onclick=()=>loadYT(true))};
function vVideos(){if(!S.got.videos)return `<div class="empty">Cargando videos…</div>`;const f=S.fv,all=entradas().filter(x=>f==="todas"||x.p===f||(!x.p&&(x.redes||[]).includes(f)));
  const cols=COLS.filter(c=>c.k!=="revision"||all.some(x=>x.col==="revision"));
  return chipsH("fv",[["todas","Todas"],...redes().map(r=>[r,nm(r)])])+`<div class="board" style="--cols:${cols.length}">${cols.map(c=>{const it=all.filter(x=>x.col===c.k).sort((a,b)=>(a.v.orden??99)-(b.v.orden??99));
    return `<div class="col" data-k="${c.k}"><h3>${c.t}<span class="c">${it.length}</span></h3><p class="hint">${c.h}</p><div class="cards">${it.length?it.map(cardV).join(""):`<div class="empty">Nada aquí</div>`}</div></div>`}).join("")}</div>
  <p class="small dim" style="margin-top:10px">${isMobile()?"Desliza para ver todas las columnas. ":""}Para publicar hace falta tu aprobación: la app nunca sube ni borra contenido por su cuenta.</p>`}
function cardV(x){const v=x.v,tags=`<span class="code">${esc(v.codigo||"")}</span>${v.categoria?`<span class="tag">${esc(v.categoria)}</span>`:""}`;
  if(!x.p)return `<article class="vcard"><div class="meta">${tags}${(x.redes||[]).map(r=>`<span class="plat ${esc(r)}">${esc(nm(r))}</span>`).join("")}${editBtn("videos",v._id)}</div><div class="t">${esc(v.titulo)}</div>${v.notas?`<div class="note">${esc(v.notas)}</div>`:""}${v.archivo?`<div class="note code">${esc(v.archivo)}</div>`:""}</article>`;
  const i=x.i||{};return `<article class="vcard p-${esc(x.p)}"><div class="meta">${tags}<span class="plat ${esc(x.p)}">${esc(nm(x.p))}</span>${editBtn("videos",v._id)}</div><div class="t">${esc(i.titulo||v.titulo)}</div>${i.fecha?`<div class="note">${x.col==="subido"?"Publicado":"Fecha"}: ${esc(fmtF(i.fecha))}</div>`:""}${i.nota?`<div class="note">${esc(i.nota)}</div>`:""}${i.url?`<a class="lnk" href="${esc(i.url)}" target="_blank" rel="noopener">Ver en ${esc(nm(x.p))} ↗</a>`:""}</article>`}
function vRedes(){if(!S.got.videos)return `<div class="empty">Cargando…</div>`;const r=S.fr,items=S.videos.filter(v=>match(v)&&(v.plataformas||{})[r]).sort((a,b)=>(a.orden??99)-(b.orden??99));
  return chipsH("fr",redes().map(x=>[x,nm(x)]))+(items.length?`<div class="feed">${items.map(v=>pieza(v,r,v.plataformas[r])).join("")}</div>`:`<div class="empty">No hay piezas para ${esc(nm(r))} todavía.${S.canEdit?" Agrega la red a un video desde «Editar».":""}</div>`)}
function bdg(st){return `<span class="bdg ${st==="subido"?"ok":esc(st)}">${esc(lab(EST_RED,st))}</span>`}
const textoRed=(v,i)=>[i.titulo||v.titulo,i.descripcion||"",i.hashtags||""].filter(Boolean).join("\n\n");
function copyBtns(v,r,i){return `<div class="copyrow"><button class="btn sm" data-copy="${esc(textoRed(v,i))}">Copiar texto</button>${i.hashtags?`<button class="btn sm" data-copy="${esc(i.hashtags)}">Copiar hashtags</button>`:""}${i.url?`<a class="lnk" style="margin:0" href="${esc(i.url)}" target="_blank" rel="noopener">Abrir ↗</a>`:""}${editBtn("videos",v._id)}</div>`}
function pieza(v,r,i){const big=esc((v.gancho||v.titulo||"").slice(0,60)),st=i.estado||"pendiente";

async function loadYT(force){if(!S.mcp)return null;try{const r=await S.mcp.callTool("vidIQ","vidiq_user_channels",{},{cache:force?{staleTime:0,gcTime:18e5,refresh:true}:{staleTime:18e5,gcTime:18e5}});const p=pl(r);

let ED=null;
function nextCode(col,pre,n){const nums=S[col].map(x=>parseInt(String(x.codigo||"").replace(pre,""),10)).filter(x=>!isNaN(x));return pre+String((nums.length?Math.max(...nums):0)+1).padStart(n,"0")}
function openEd(col,id,draft){if(!S.canEdit)return;const list=S[col],o=draft||(id?structuredClone(list.find(x=>x._id===id)||{}):{});ED={col,id,o};
  let h="";
  if(col==="videos"){const pls=o.plataformas||{},sel_r=new Set([...Object.keys(pls),...(o.redes||[])]);
    h=`<div class="fgrid">${inp("codigo","Código",o.codigo||nextCode("videos","C-",4))}${sel("etapa","Etapa",ETAPAS,o.etapa||"idea")}${inp("titulo","Título",o.titulo,"text",true)}${inp("categoria","Categoría",o.categoria)}${inp("orden","Orden",o.orden??"","number")}${inp("gancho","Gancho (texto de portada)",o.gancho,"text",true)}${inp("archivo","Archivo del video",o.archivo,"text",true)}${ta("notas","Notas",o.notas)}</div>
    <fieldset class="red"><legend>Redes</legend><div class="redes-check">${redes().map(r=>`<label><input type="checkbox" id="f_red_${esc(r)}"${sel_r.has(r)?" checked":""}> ${esc(nm(r))}</label>`).join("")}</div><div class="fgrid" style="margin-top:10px">${inp("nueva_red","Otra red (escríbela)","")}</div></fieldset>
    ${redes().concat(Object.keys(pls).filter(r=>!redes().includes(r))).filter(r=>sel_r.has(r)).map(r=>{const i=pls[r]||{};return `<fieldset class="red"><legend>${esc(nm(r))}</legend><div class="fgrid">${sel("st_"+r,"Estado",EST_RED,i.estado||"pendiente")}${inp("fe_"+r,"Fecha",toLocal(i.fecha),"datetime-local")}${inp("ti_"+r,"Título en esta red",i.titulo,"text",true)}${ta("de_"+r,"Descripción",i.descripcion)}${inp("ha_"+r,"Hashtags",i.hashtags,"text",true)}${inp("ur_"+r,"Enlace",i.url,"url",true)}${inp("no_"+r,"Nota",i.nota,"text",true)}</div></fieldset>`}).join("")}`}
  if(col==="clips")h=`<div class="fgrid">${inp("codigo","Código",o.codigo||nextCode("clips","K-",4))}${sel("estado","Estado",EST_CLIP,o.estado||"propuesto")}${inp("titulo","Título",o.titulo,"text",true)}${inp("juego","Juego",o.juego)}${inp("duracion","Duración (mm:ss)",o.duracion)}${inp("fecha","Fecha",toLocal(o.fecha),"datetime-local")}${inp("redes","Redes (separadas por coma)",(o.redes||[]).join(", "))}${inp("archivo","Archivo",o.archivo,"text",true)}${ta("notas","Notas",o.notas)}</div>`;
  if(col==="estudios")h=`<div class="fgrid">${inp("asignatura","Asignatura",o.asignatura,"text",true)}${inp("codigo","Código",o.codigo)}${inp("titulo","Evaluación",o.titulo)}${inp("cierre","Cierre",toLocal(o.cierre),"datetime-local")}${sel("estado","Estado",EST_EV,o.estado||"pendiente")}${inp("peso","Peso",o.peso)}${inp("nota","Nota",o.nota)}${inp("accion","Qué hacer",o.accion,"text",true)}${inp("archivo","Archivo",o.archivo,"text",true)}</div>`;
  h+=`<div class="actions"><button class="btn pri" type="button" id="edSave">Guardar</button><button class="btn" type="button" data-close>Cancelar</button>${id?`<button class="btn danger" type="button" id="delBtn" style="margin-left:auto">Borrar</button>`:""}<div class="msg" id="edMsg"></div></div>`;
  openSheet((id?"Editar ":"Nuevo ")+({videos:"video",clips:"clip",estudios:"evaluación"})[col],h);
  $$("#edBody .redes-check input").forEach(c=>c.onchange=()=>{collectInto();openEd(ED.col,ED.id,ED.o)});
  $("#f_nueva_red")?.addEventListener("change",()=>{collectInto();openEd(ED.col,ED.id,ED.o)});
  $("#edSave").onclick=saveEd;const d=$("#delBtn");if(d)confirmTap(d,delEd,"Pulsa otra vez para borrar")}
function collectInto(){const {col,o}=ED;if(col!=="videos")return;
  ["codigo","titulo","categoria","gancho","archivo","notas","etapa"].forEach(k=>{const v=val(k);if(v!==undefined)o[k]=v});
  const ord=val("orden");o.orden=ord===""||ord===undefined?o.orden:Number(ord);
  const pls=o.plataformas||{},nr=(val("nueva_red")||"").toLowerCase().replace(/[^a-z0-9_-]/g,"");
  const chosen=new Set($$("#edBody .redes-check input:checked").map(c=>c.id.replace("f_red_","")));if(nr)chosen.add(nr);
  for(const r of [...new Set([...Object.keys(pls),...chosen])]){if(!chosen.has(r)){delete pls[r];continue}const i=pls[r]||{};
    const g=k=>val(k+"_"+r);if(g("st")!==undefined){i.estado=g("st");i.fecha=fromLocal(g("fe"));i.titulo=g("ti");i.descripcion=g("de");i.hashtags=g("ha");i.url=g("ur");i.nota=g("no")}else i.estado=i.estado||"pendiente";
    Object.keys(i).forEach(k=>{if(i[k]===""||i[k]===undefined)delete i[k]});pls[r]=i}
  o.plataformas=pls;o.redes=[...chosen];
  if(nr&&!redes().includes(nr)){S.config={...(S.config||{}),redes:[...redes(),nr]};S._saveConfig=true}}
async function saveEd(){const {col,id}=ED;let o=ED.o;
  if(col==="videos"){collectInto();o=ED.o}
  else if(col==="clips"){["codigo","titulo","juego","duracion","archivo","notas","estado"].forEach(k=>o[k]=val(k));o.fecha=fromLocal(val("fecha"));o.redes=(val("redes")||"").split(",").map(s=>s.trim().toLowerCase()).filter(Boolean)}
  else{["asignatura","codigo","titulo","estado","peso","nota","accion","archivo"].forEach(k=>o[k]=val(k));o.cierre=fromLocal(val("cierre"))}
  const docId=id||(col==="estudios"?"ev-"+Date.now().toString(36):(o.codigo||"").replace(/[^A-Za-z0-9_-]/g,"")||col+"-"+Date.now().toString(36));
  if(col==="estudios"&&(!o.asignatura||!o.titulo||!o.cierre)){$("#edMsg").textContent="Completa asignatura, evaluación y cierre.";return}
  if(col!=="estudios"&&!o.titulo){$("#edMsg").textContent="Ponle un título.";return}
  if(!id&&S[col].some(x=>x._id===docId)){$("#edMsg").textContent="Ya existe un elemento con el código "+docId+". Cambia el código.";return}
  const prev=id?S[col].find(x=>x._id===id):null;
  try{const body={};Object.entries(o).forEach(([k,v])=>{if(k!=="_id"&&k!=="dispositivo"&&v!==undefined&&v!=="")body[k]=v});body.actualizado=nowISO();body.dispositivo=DEV();
    await S.db.collection(col).doc(docId).set(body);log((id?"Editado ":"Creado ")+({videos:"video",clips:"clip",estudios:"evaluación"})[col],(o.codigo||"")+" "+(o.titulo||""));
    if(col==="videos"&&prev)Object.entries(body.plataformas||{}).forEach(([p,i])=>{const old=prev.plataformas?.[p]?.estado;if(old!==i.estado)pushNotif("vst-"+docId+"-"+p+"-"+i.estado,"Estado de video: "+lab(EST_RED,i.estado),(o.codigo||"")+" "+nm(p)+" · "+(i.titulo||o.titulo),i.estado==="subido"?"publicacion":"contenido")});
    if(S._saveConfig){await S.db.doc("meta/config").set({redes:S.config.redes});S._saveConfig=false}closeSheet();toast("Guardado")}
  catch(err){$("#edMsg").textContent="No se pudo guardar ("+errTxt(err)+"). Revisa tu conexión e inténtalo otra vez."}}
async function delEd(){const {col,id,o}=ED;try{await S.db.collection(col).doc(id).delete();log("Borrado "+({videos:"video",clips:"clip",estudios:"evaluación"})[col],(o.codigo||id)+" "+(o.titulo||""));closeSheet();toast("Borrado")}catch(err){$("#edMsg").textContent="No se pudo borrar ("+errTxt(err)+")."}}

/* ---------- CALENDARIO ---------- */
/* Turnos: ciclo trabajo/descanso; con "alterna", los bloques de trabajo se turnan día ↔ noche. */
const TIPO_T={dia:"Día",noche:"Noche"};
function turnoDe(d){const t=S.turnos;if(!t?.inicio)return null;const a=new Date(t.inicio+"T12:00:00"),b=new Date(dayKey(d)+"T12:00:00");const T=+(t.dias_trabajo||7),D=+(t.dias_descanso||7),C=T+D;
  const diff=Math.round((b-a)/864e5),m=((diff%C)+C)%C,n=Math.floor(diff/C);const otro=x=>x==="noche"?"dia":"noche";
  const tipoN=k=>t.alterna?(((k%2)+2)%2===0?(t.primer_tipo||"dia"):otro(t.primer_tipo||"dia")):null;
  const hor=x=>x==="noche"?(t.horario_noche||"20:00–08:00"):x==="dia"?(t.horario_dia||"08:00–20:00"):(t.horario||"");
  if(m<T){const tipo=tipoN(n);return{trabajo:true,dia:m+1,de:T,tipo,horario:hor(tipo)}}const sig=tipoN(n+1);return{trabajo:false,dia:m-T+1,de:D,siguiente:sig,horario_sig:hor(sig)}}
function turnoLbl(tu){if(!tu)return"";return tu.trabajo?(tu.tipo?(tu.tipo==="noche"?"🌙 Noche ":"☀️ Día ")+tu.dia+"/"+tu.de:"Trabajo "+tu.dia+"/"+tu.de):"Descanso "+tu.dia+"/"+tu.de}
function turnoHoyTxt(){const t=turnoDe(Date.now());if(!t)return"Turno 7x7 sin configurar";
  if(t.trabajo)return `Turno ${t.tipo?(t.tipo==="noche"?"noche":"día")+" ":""}· día ${t.dia} de ${t.de}${t.horario?" · "+t.horario:""}`;
  return `Descanso: día ${t.dia} de ${t.de}${t.siguiente?" · luego turno "+(t.siguiente==="noche"?"noche":"día"):""}`}
const horaIni=h=>{const m=String(h||"").match(/(\d{1,2}):(\d{2})/);return m?[+m[1],+m[2]]:null};
const horaFin=h=>{const m=String(h||"").match(/\d{1,2}:\d{2}\D+(\d{1,2}):(\d{2})/);return m?[+m[1],+m[2]]:null};
function calItems(from,to){const out=[],a=from.getTime(),b=to.getTime(),inR=f=>{const x=new Date(f).getTime();return x>=a&&x<b};
  S.tareas.forEach(t=>{if(t.fecha_limite&&inR(t.fecha_limite))out.push({k:"tarea",t:t.titulo,f:t.fecha_limite,s:(t.estado==="completada"?"Completada · ":tareaVencida(t)?"Vencida · ":"Tarea · ")+lab(PRIOS,t.prioridad||"media"),go:()=>openTarea(t._id)})});
  S.estudios.forEach(e=>{if(e.cierre&&inR(e.cierre))out.push({k:"iacc",t:e.asignatura+" · "+e.titulo,f:e.cierre,s:"IACC · "+lab(EST_EV,e.estado)+(e.peso?" · "+e.peso:""),go:()=>S.canEdit?openEd("estudios",e._id):go("calendario","estudios")})});
  S.eventos.forEach(e=>{if(e.inicio&&inR(e.inicio))out.push({k:"evento",t:e.titulo,f:e.inicio,allDay:e.todo_el_dia,s:lab(TIPO_EV,e.tipo||"personal")+(e.fin?" · hasta "+fmtT(e.fin):""),go:()=>openEvento(e._id)})});
  S.videos.forEach(v=>Object.entries(v.plataformas||{}).forEach(([p,i])=>{if(i.fecha&&["programado","subido"].includes(i.estado)&&inR(i.fecha))out.push({k:"pub",t:(v.codigo?v.codigo+" · ":"")+(i.titulo||v.titulo),f:i.fecha,s:(i.estado==="subido"?"Publicado":"Programado")+" · "+nm(p),go:()=>go("contenido","videos")})}));
  (S.gcal?.items||[]).forEach(e=>{if(inR(e.f))out.push({k:"gcal",t:e.t,f:e.f,allDay:e.allDay,s:"Google Calendar"+(e.loc?" · "+e.loc:""),go:null})});
  if(S.turnos?.inicio)for(let x=from.getTime()+43200000;x<b;x+=864e5){const tu=turnoDe(x);if(!tu?.trabajo)continue;const k=dayKey(x),hi=horaIni(tu.horario)||[8,0];const[y,mo,dd]=k.split("-").map(Number);const f=zonedISO(y,mo,dd,hi[0],hi[1]);
    if(inR(f))out.push({k:"turno",t:"Turno "+(tu.tipo?(tu.tipo==="noche"?"noche":"día"):"")+(tu.horario?" · "+tu.horario:""),f,s:"Día "+tu.dia+" de "+tu.de+(S.turnos.lugar?" · "+S.turnos.lugar:"")+(tu.tipo==="noche"?" · sales al día siguiente":""),go:()=>go("calendario","turnos")})}
  return out.sort((x,y)=>new Date(x.f)-new Date(y.f))}
VIEWS.calendario=()=>{const nd=needData();const s=S.sub.calendario||"agenda";
  return `<h1 class="vt">Calendario</h1><p class="vs">${esc(turnoHoyTxt())} · Personal, turnos 7x7, IACC, publicaciones, tareas y Google Calendar.</p>${nd}
  ${subnav("calendario",[["agenda","Agenda"],["mes","Mes"],["estudios","IACC"],["turnos","Turnos 7x7"]])}

async function sendPC(accion,instruccion,cmdId){const id=cmdId||uid("c");const cfg=S.pcCfg||{};
  if(!cmdId){try{await S.db.collection("comandos").doc(id).set({texto:instruccion,estado:"pendiente",tipo:"pc",accion,creado:nowISO(),actualizado:nowISO(),dispositivo:DEV(),acciones:[]});log("Orden al PC",instruccion,"pc")}catch(e){return{estado:"fallido",detalle:"No se pudo registrar la orden ("+errTxt(e)+")"}}}
  if(!cfg.sesion_id||!S.mcp){const det=!S.mcp?"Conectores no disponibles en esta vista":"El puente con el PC no está configurado (PC Control → Elegir sesión del PC)";if(!cmdId)await cmdWrite(id,{estado:"pendiente_config",error:det});return{estado:"pendiente_config",detalle:det}}
  const msg=`[BWISIOM HQ · orden ${id}] Acción: ${accion}
Instrucción del dueño: ${instruccion}

Procedimiento (BWISIOM HQ, ver hq/agente-pc/README.md):
1. Ejecuta SOLO mediante el agente local: python bwisiom_pc_agent.py ${accion.startsWith("ejecutar:")?"run "+accion.slice(9):accion==="otra"?"estado":accion} (el agente rechaza todo lo que no esté en acciones_autorizadas.json). No ejecutes nada fuera de esa lista; si la instrucción requiere otra cosa, no la hagas y explícalo.
2. Con ArtifactData sobre ${ART_URL}: actualiza el documento pc/estado con el JSON que imprime "python bwisiom_pc_agent.py estado", y en comandos/${id} escribe {estado:"completado" o "fallido", respuesta:<resumen breve en español>, actualizado:<ISO>}.`;
  try{await S.mcp.callTool("Claude Code Remote","send_message",{session_id:cfg.sesion_id,message:msg});await cmdWrite(id,{estado:"esperando_pc",destino:cfg.titulo||cfg.sesion_id});S.conn.ccr="ok";return{estado:"esperando_pc",detalle:"Orden enviada al PC; queda en espera hasta que el PC responda"}}
  catch(e){const det="No se pudo enviar al PC: "+mcpErr(e,"Claude Code Remote");await cmdWrite(id,{estado:"fallido",error:det});return{estado:"fallido",detalle:det}}}

  <h2>iPhone (Safari)</h2><ol class="small muted"><li>Abre ${esc(PWA_URL)} en Safari.</li><li>Toca Compartir → «Agregar a pantalla de inicio».</li><li>Ábrela desde el icono. La primera vez inicia sesión en claude.ai.</li></ol>`}
function aSeg(){return `<div class="card small muted" style="display:grid;gap:8px">
  <div>${ic("lock")} <b style="color:var(--fg)">Autenticación:</b> la app solo muestra datos a cuentas de Claude con acceso a este BWISIOM HQ privado. Sesión protegida por claude.ai (HTTPS).</div>
  <div><b style="color:var(--fg)">Permisos:</b> la base de datos solo acepta escrituras del dueño (regla <span class="code">write: admin</span>). Las vistas sin permiso son de solo lectura.</div>
  <div><b style="color:var(--fg)">Credenciales:</b> ninguna contraseña ni clave API en el código. Los conectores (Google Calendar, vidIQ, Claude Code Remote) usan tus credenciales guardadas en claude.ai; la app nunca ve tokens.</div>
  <div><b style="color:var(--fg)">Acciones destructivas:</b> borrar o archivar pide confirmación con un segundo toque. La IA no tiene herramientas para borrar ni publicar.</div>
  <div><b style="color:var(--fg)">Registro:</b> cada creación, edición, borrado, comando y orden al PC queda en el registro con fecha y dispositivo.</div>
  <div><b style="color:var(--fg)">PC:</b> no se expone ningún puerto. El PC mantiene una conexión saliente cifrada (Remote Control de Claude Code) y el agente solo ejecuta acciones de <span class="code">acciones_autorizadas.json</span>.</div>
  <div><b style="color:var(--fg)">Privacidad del teléfono:</b> la app no lee otras apps, mensajes, contraseñas ni actividad del teléfono. Solo BWISIOM HQ y las integraciones que autorizaste.</div></div>`}
function aReg(){return S.registro.length?`<div class="list">${S.registro.map(regItem).join("")}</div><p class="small dim" style="margin-top:8px">Últimos ${S.registro.length} registros.</p>`:`<div class="empty">Sin registros todavía.</div>`}
after.ajustes=()=>{$("#bkp")&&($("#bkp").onclick=async()=>{try{const out={exportado:nowISO(),origen:ART_URL};for(const c of ["videos","estudios","clips","proyectos","tareas","eventos","comandos","notificaciones","meta"]){const s=await S.db.collection(c).get();out[c]=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]))}
  const r=await S.downloads.save({filename:"bwisiom-hq-respaldo-"+dayKey(Date.now())+".json",data:JSON.stringify(out,null,2)});if(r?.status==="saved")toast("Respaldo guardado");log("Respaldo descargado","",)}catch(e){if(e?.code!=="cancelled"&&e?.code!=="declined")toast("No se pudo descargar ("+errTxt(e)+")",true)}})};

/* ============ AL ENTRAR A UNA VISTA ============ */
function onEnter(k){if(k==="automatizaciones"&&S.triggers==null)loadTriggers();if(k==="calendario")loadGcal();if(k==="contenido"&&S.sub.contenido==="stats"&&!S.yt)loadYT();if(k==="inicio"&&S.mcp&&S.triggers==null)loadTriggers()}

/* ============ CONECTORES: utilidades ============ */
function pl(r){let p=r?.payload;if(typeof p==="string"){const a=p.indexOf("{"),b=p.lastIndexOf("}");if(a>=0&&b>a){try{p=JSON.parse(p.slice(a,b+1))}catch(e){}}}return p}
function mcpErr(e,srv){const c=e?.code||"upstream_error";return({needs_reauth:"Reconecta "+srv+" en claude.ai → Ajustes → Conectores.",server_not_connected:"Agrega el conector "+srv+" en claude.ai → Ajustes → Conectores.",selection_required:"Elige qué conector "+srv+" usar en el aviso de claude.ai.",not_in_manifest:"No autorizaste "+srv+" para esta app. Actívalo en Permisos del artifact.",blocked_by_policy:"Tu organización bloquea esta herramienta de "+srv+".",approval_required:"Falta tu aprobación para usar "+srv+".",server_unavailable:srv+" no responde ahora; inténtalo en un momento.",tool_error:srv+" informó un error: "+String(e.message||"").slice(0,160),not_granted:"Los conectores no están permitidos en esta vista.",capability_disabled:"Los conectores no están disponibles en esta vista."}[c])||(srv+": "+c)}

/* ============ REGLAS INTERNAS ============ */
async function runRules(){if(!S.db||!S.canEdit||!S.lastSync)return;const R=reglasCfg(),now=Date.now();S.lastRules=nowISO();const PS=[];const P=(...a)=>{PS.push(pushNotif(...a))};
  if(R.vencidas)S.tareas.filter(tareaVencida).forEach(t=>P("venc-"+t._id+"-"+(t.fecha_limite||"").slice(0,16),"Tarea vencida",t.titulo+" · venció "+fmtF(t.fecha_limite),"vencida"));
  if(R.recordatorios)S.tareas.filter(t=>t.estado!=="completada"&&t.recordatorio&&new Date(t.recordatorio)<=now&&now-new Date(t.recordatorio)<7*864e5).forEach(t=>P("rec-"+t._id+"-"+t.recordatorio.slice(0,16),"Recordatorio",t.titulo,"recordatorio"));
  if(R.iacc)S.estudios.filter(e=>["pendiente","listo"].includes(e.estado)&&new Date(e.cierre)>now&&new Date(e.cierre)-now<48*36e5).forEach(e=>P("iacc-"+e._id+"-"+e.cierre.slice(0,10),"Plazo IACC en menos de 48 h",e.asignatura+" · "+e.titulo+" · cierra "+fmtF(e.cierre),"iacc"));
  if(R.contenido){S.videos.forEach(v=>{if(v.etapa==="revision")P("rev-"+v._id,"Video listo para revisar",(v.codigo||"")+" "+v.titulo,"contenido");Object.entries(v.plataformas||{}).forEach(([p,i])=>{if(i.estado==="subido"&&i.fecha&&now-new Date(i.fecha)<3*864e5)P("pub-"+v._id+"-"+p,"Publicación realizada",(v.codigo||"")+" en "+nm(p)+" · "+(i.titulo||v.titulo),"publicacion");if(i.estado==="revision")P("vrev-"+v._id+"-"+p,"Pieza en revisión",(v.codigo||"")+" "+nm(p),"contenido")})});
    S.clips.forEach(c=>{if(c.fecha&&now-new Date(c.fecha)<3*864e5)P("clip-"+c._id,"Nuevo clip del PC",(c.titulo||c.codigo||"Clip")+(c.juego?" · "+c.juego:""),"contenido")})}
  if(R.pc&&S.pcCfg?.sesion_id&&S.pcEstado?.actualizado&&now-new Date(S.pcEstado.actualizado)>15*6e4)P("pcoff-"+S.pcEstado.actualizado.slice(0,16),"El PC dejó de reportar","Último estado "+fmtF(S.pcEstado.actualizado),"pc");
  S.comandos.filter(c=>c.estado==="esperando_pc"&&now-new Date(c.actualizado||c.creado)>30*6e4).forEach(c=>P("pcwait-"+c._id,"El PC no ha respondido una orden",c.texto.slice(0,120),"pc"));
  const n=(await Promise.all(PS)).filter(Boolean).length;if(n)log("Reglas internas: "+n+" aviso(s) nuevo(s)",REGLAS.filter(([k])=>R[k]).map(r=>r[0]).join(", "),"automatizacion");
  if(S.view==="automatizaciones")render()}

/* ============ DATOS ============ */
function setSync(c,t){$("#sync").className="sync "+c;$("#syncTxt").textContent=t}
let rq=0;const rerender=()=>{cancelAnimationFrame(rq);rq=requestAnimationFrame(()=>{const a=document.activeElement;if(a&&a.matches("textarea,input")&&$("#view").contains(a)&&a.value){badges();return}render()})};
function hideSplash(){const s=$("#splash");if(!s||s.dataset.out)return;s.dataset.out=1;s.classList.add("out");setTimeout(()=>s.remove(),450)}
buildNav();route();setTimeout(hideSplash,1600);
(async()=>{const slow=setTimeout(()=>setSync("stale","Sin conexión todavía"),10000);
  let db=null;try{db=await window.claude?.use?.("db")}catch(e){}
  if(!db){clearTimeout(slow);setSync("err","Sin datos en esta vista");hideSplash();render();return}
  S.db=db;
  try{const u=await window.claude.use("user");S.canEdit=!!(u&&await(u.canEdit?.()??u.isOwner?.()))}catch(e){S.canEdit=false}
  window.claude.use("sample").then(s=>{S.sample=s;render()}).catch(()=>{});
  window.claude.use("mcp").then(m=>{S.mcp=m;if(m){onEnter(S.view)}render()}).catch(()=>{});
  window.claude.use("downloads").then(d=>{S.downloads=d}).catch(()=>{});
  const err=()=>{clearTimeout(slow);setSync("err","No se pudieron leer los datos")};
  const live=()=>{S.lastSync=nowISO();clearTimeout(slow);setSync("live","En vivo");hideSplash()};
  const sub=(col,q)=>(q||db.collection(col)).onSnapshot(snap=>{S[col]=snap.docs.map(d=>({...d.data(),_id:d.id}));if(!snap.metadata.fromCache){S.got[col]=true;live()}else if(snap.size)S.got[col]=true;rerender()},err);
  ["videos","estudios","clips","proyectos","tareas","eventos"].forEach(c=>sub(c));
  sub("comandos",db.collection("comandos").orderBy("creado","desc").limit(100));
  sub("notificaciones",db.collection("notificaciones").orderBy("creado","desc").limit(300));
  sub("registro",db.collection("registro").orderBy("fecha","desc").limit(150));
  const docSub=(path,key)=>db.doc(path).onSnapshot(s=>{S[key]=s.exists?s.data():null;if(!s.metadata.fromCache)live();rerender()},err);
  docSub("meta/info","meta");docSub("meta/config","config");docSub("meta/turnos","turnos");docSub("meta/reglas","reglas");docSub("meta/pc","pcCfg");docSub("pc/estado","pcEstado");
  setTimeout(runRules,8000);setInterval(runRules,60000);
  setInterval(()=>{if(S.lastSync)setSync("live","En vivo");if(["inicio","pc"].includes(S.view)&&!document.activeElement?.matches("textarea,input"))render()},60000);
})();
})();
</script>
